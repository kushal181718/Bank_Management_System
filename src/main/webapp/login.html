<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b,#020617);
    overflow:hidden;
    position:relative;
}

/* Glowing Background */
body::before{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#2563eb;
    border-radius:50%;
    filter:blur(180px);
    top:-120px;
    left:-100px;
    opacity:.35;
}

body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#9333ea;
    border-radius:50%;
    filter:blur(170px);
    bottom:-120px;
    right:-100px;
    opacity:.30;
}

/* Login Card */
/* Login Card */
form{
    width:390px;
    padding:40px;
    border-radius:18px;
    background:rgba(255,255,255,0.08); /* Very light transparency */
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

h2{
    text-align:center;
    color:#fff;
    font-size:30px;
    margin-bottom:30px;
    letter-spacing:1px;
}

label{
    display:block;
    color:#e5e7eb;
    margin-bottom:8px;
    font-weight:500;
}

input{
    width:100%;
    padding:15px 18px;
    margin-bottom:22px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:#fff;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input::placeholder{
    color:#9ca3af;
}

input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 12px rgba(59,130,246,.45);
    background:rgba(255,255,255,.09);
}

/* Login Button */
button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.35s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(59,130,246,.45);
}

button:active{
    transform:scale(.98);
}

a{
    display:block;
    margin-top:18px;
    text-align:center;
    color:#cbd5e1;
    text-decoration:none;
}

a:hover{
    color:#60a5fa;
}
</style>
</head>
<body>
<form action="loginServ" method="post">

    <h2>Welcome Back</h2>

    <label>Email</label>
    <input type="email"
           placeholder="Enter your email"
           name="email"
           required>

    <label>Password</label>
    <input type="password"
           placeholder="Enter your password"
           name="password"
           required>

    <button type="submit">Login</button>

    <a href="#">Forgot Password?</a>

    <p class="login-text">
        Don't Have an Account?
        <a href="Signup.html">Signup Here</a>
    </p>

</form>
	
</body>
</html>
